<svg width="250" height="44" viewBox="0 0 250 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg_blue_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sg_badge_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0043B8" />
    </linearGradient>
    <filter id="sg_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 360 Dynamic Geometric Growth Icon Mark -->
  <g transform="translate(4, 4)">
    <!-- Outer Orbit Ring (360 Degree OS) -->
    <circle cx="18" cy="18" r="16" stroke="#0F172A" stroke-width="2.5" stroke-dasharray="75 25" stroke-linecap="round" />
    <!-- Glowing Orbital Active Node -->
    <circle cx="31" cy="8" r="2.5" fill="#38BDF8" />
    <!-- Inner Growth Velocity Ring -->
    <circle cx="18" cy="18" r="11" stroke="url(#sg_blue_grad)" stroke-width="2.5" stroke-dasharray="48 20" stroke-linecap="round" transform="rotate(-40 18 18)" />
    <!-- Upward Exponential Scaling Vector (Arrow) -->
    <path d="M13 23L23 13M23 13H16.5M23 13V19.5" stroke="url(#sg_blue_grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark -->
  <!-- "Studio" in Dark Slate / Navy -->
  <text x="50" y="29" fill="#0F172A" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.6">Studio</text>
  
  <!-- "Growth" in Electric Blue -->
  <text x="119" y="29" fill="url(#sg_blue_grad)" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.6">Growth</text>

  <!-- "360°" SaaS Accent Pill Badge -->
  <g transform="translate(198, 10)">
    <rect x="0" y="0" width="48" height="24" rx="7" fill="url(#sg_badge_grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" filter="url(#sg_glow)" />
    <text x="24" y="17" fill="#FFFFFF" font-family="'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="0.5" text-anchor="middle">360°</text>
  </g>
</svg>
